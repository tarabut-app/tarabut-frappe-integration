[project]
name = "tarabut-frappe-integration"
version = "0.1.5"
description = "Frappe and ERPNext integration app for Tarabut marketplace sync"
requires-python = ">=3.10"
dependencies = []
license = { text = "MIT" }
readme = "README.md"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0"
erpnext = ">=15.0.0"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["tarabut_connector*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
